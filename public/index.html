<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>OptiCode IDE</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(120% 140% at 10% 10%, #1e1e1e, #121212);
        color: #e8e8e8;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        height: 100vh;
        overflow: hidden;
      }
      #main {
        height: 100vh;
      }
      #loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #0d0d0f;
        color: #e8e8e8;
        z-index: 1;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.08);
        border-top-color: #5ad1ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-text {
        letter-spacing: 0.4px;
        font-weight: 600;
        font-size: 15px;
        opacity: 0.9;
      }
      .loader-sub {
        font-size: 12px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner" aria-label="Loading"></div>
      <div class="loader-text">OptiCode 正在启动…</div>
      <div class="loader-sub">初始化工作区与扩展，请稍候</div>
    </div>
    <div id="main"></div>
    <script>
      // 移除 loader：当 main 节点被框架接管后隐藏；防止长时间白屏/灰屏。
      (function() {
        const loader = document.getElementById('loader');
        const main = document.getElementById('main');
        if (!loader || !main) return;

        const hide = () => {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 180ms ease-out';
          setTimeout(() => loader.remove(), 220);
        };

        const observer = new MutationObserver(() => {
          if (main.childElementCount > 0) {
            hide();
            observer.disconnect();
          }
        });

        observer.observe(main, { childList: true });
        // 兜底：5s 自动隐藏，避免异常阻塞
        setTimeout(() => {
          if (document.body.contains(loader)) hide();
          observer.disconnect();
        }, 5000);
      })();
    </script>
  </body>
</html>
