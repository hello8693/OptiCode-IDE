<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>OptiCode IDE</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #0b0c10;
        color: #eef2f7;
        font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Avenir Next", "Segoe UI", sans-serif;
        user-select: none;
      }
      #main {
        height: 100vh;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: #0b0c10;
        color: #eef2f7;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
      }
      .loader-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: rgba(255, 255, 255, 0.85);
        animation: fallback-spin 1s linear infinite;
      }
      .loader-text {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.2px;
        opacity: 0.95;
      }
      .loader-sub {
        font-size: 12px;
        letter-spacing: 0.2px;
        opacity: 0.66;
      }
      @keyframes fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="loader-content">
        <div class="loader-ring" aria-hidden="true"></div>
        <div class="loader-text">OptiCode 正在启动…</div>
        <div class="loader-sub">初始化工作区与扩展，请稍候</div>
      </div>
    </div>
    <div id="main"></div>
    <script>
      // 移除 loader：当 main 节点被框架接管后隐藏；防止长时间白屏/灰屏。
      (function() {
        const loader = document.getElementById('loader');
        const main = document.getElementById('main');
        if (!loader || !main) return;

        const hide = () => {
          const unmount = window.__opticodeUnmountLoader;
          if (typeof unmount === 'function') {
            unmount();
          }
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 180ms ease-out';
          setTimeout(() => loader.remove(), 220);
        };

        const observer = new MutationObserver(() => {
          if (main.childElementCount > 0) {
            hide();
            observer.disconnect();
          }
        });

        observer.observe(main, { childList: true });
        // 兜底：5s 自动隐藏，避免异常阻塞
        setTimeout(() => {
          if (document.body.contains(loader)) hide();
          observer.disconnect();
        }, 5000);
      })();
    </script>
  </body>
</html>
