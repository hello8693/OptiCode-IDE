<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OptiCode IDE</title>
    <script>
      window.global = window;
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0b0c10;
        color: #eef2f7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }

      #main {
        height: 100%;
        width: 100%;
      }

      .fallback {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 48px;
      }
      .fallback-bar {
        width: 6px;
        height: 120px;
        border-radius: 6px;
        background: linear-gradient(180deg, #ff5f6d 0%, #ffc371 45%, #5c7cff 100%);
        margin-right: 16px;
        box-shadow: 0 10px 30px rgba(255, 120, 120, 0.25);
      }
      .fallback-title {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.2px;
      }
      .fallback-meta {
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.7;
        letter-spacing: 0.2px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div class="fallback">
        <div class="fallback-bar"></div>
        <div>
          <div class="fallback-title">OptiCode IDE</div>
          <div class="fallback-meta" id="fallback-version">vdev</div>
          <div class="fallback-meta" id="fallback-build">build dev</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var version = params.get('version') || 'dev';
          var build = params.get('build') || 'dev';
          var vEl = document.getElementById('fallback-version');
          var bEl = document.getElementById('fallback-build');
          if (vEl) vEl.textContent = 'v' + version;
          if (bEl) bEl.textContent = 'build ' + build;
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </body>
</html>
